spring:
  application:
    name: shardNest

  datasource:
    shard1:
      jdbc-url: jdbc:mysql://localhost:3306/userdb1
      username: root
      password: root@123
      driver-class-name: com.mysql.cj.jdbc.Driver

    shard2:
      jdbc-url: jdbc:mysql://localhost:3306/userdb2
      username: root
      password: root@123
      driver-class-name: com.mysql.cj.jdbc.Driver

    shard3:
      jdbc-url: jdbc:mysql://localhost:3306/userdb3
      username: root
      password: root@123
      driver-class-name: com.mysql.cj.jdbc.Driver

    shard4:
      jdbc-url: jdbc:mysql://localhost:3306/userdb4
      username: root
      password: root@123
      driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ⭐ Redis — minimal config (timeouts handled in RedisConfig.java)
  data:
    redis:
      host: localhost
      port: 6379

shard:
  replication:
    factor: 3
    write-quorum: 2
    read-quorum: 2

  cache:
    enabled: true
    ttl-seconds: 600
    key-prefix: "shardnest:"

  provision:
    admin-username: root
    admin-password: root@123
    host: localhost
    port: 3306
    max-pool-size: 10
    min-idle: 2